<!doctype html>
<html lang="es" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Barrio — Tu barrio, en un solo lugar</title>
    <meta name="description" content="El Barrio es la aplicación móvil hiperlocal para conectar con tus vecinos, comprar, vender, regalar, arrendar herramientas, encontrar servicios locales y alertas vecinales." />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://elbarrio.lat" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elbarrio.lat" />
    <meta property="og:title" content="El Barrio — Tu barrio, en un solo lugar" />
    <meta property="og:description" content="Conecta con vecinos verificados de tu sector. Mercado hiperlocal, servicios de confianza, arriendos directos y alertas comunitarias." />
    <meta property="og:site_name" content="El Barrio" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="El Barrio — Tu barrio, en un solo lugar" />
    <meta name="twitter:description" content="La super-app hiperlocal para conectar a personas que realmente viven cerca." />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "El Barrio",
      "operatingSystem": "iOS, Android",
      "applicationCategory": "SocialNetworkingApplication",
      "url": "https://elbarrio.lat",
      "description": "Aplicación móvil hiperlocal para conectar vecinos verificados, mercado entre particulares, avisos y alertas comunitarias.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "CLP"
      }
    }
    </script>
  </head>
  <body class="bg-[#FAFDFB] text-slate-800 font-sans antialiased selection:bg-[#18B68B]/20 selection:text-[#18B68B]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
