<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1440" viewBox="0 0 720 1440" role="img" aria-labelledby="title desc">
  <title id="title">Vista de la aplicación El Barrio</title>
  <desc id="desc">Pantalla de inicio con clima, alertas, mercado y actividad local.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#0f172a" flood-opacity=".2"/></filter>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BFE8D9"/><stop offset=".48" stop-color="#77C9AC"/><stop offset="1" stop-color="#0E8067"/></linearGradient>
    <style>
      .ui{font-family:Inter,Arial,sans-serif;fill:#14201c}.muted{fill:#738079}.bold{font-weight:700}.small{font-size:19px}.tiny{font-size:16px}
    </style>
  </defs>
  <g filter="url(#shadow)">
    <rect x="54" y="24" width="612" height="1388" rx="82" fill="#101412"/>
    <rect x="67" y="37" width="586" height="1362" rx="70" fill="#F7FAF8"/>
    <rect x="248" y="52" width="224" height="46" rx="23" fill="#101412"/>
  </g>
  <g class="ui">
    <rect x="67" y="102" width="586" height="150" fill="#fff"/>
    <text x="98" y="156" font-size="27" class="bold">¡Hola, vecino!</text>
    <text x="99" y="190" class="small muted">El Barrio · Las Condes</text>
    <circle cx="545" cy="166" r="34" fill="#EFF7F4"/><path d="M534 171h22M540 159l-7 12 7 12M550 159l7 12-7 12" fill="none" stroke="#0E8067" stroke-width="4" stroke-linecap="round"/>
    <circle cx="608" cy="166" r="34" fill="#18B68B"/><text x="608" y="174" text-anchor="middle" font-size="19" fill="#fff" class="bold">EB</text>

    <rect x="91" y="270" width="538" height="130" rx="26" fill="#fff" stroke="#D7E2DD" stroke-width="2"/>
    <text x="120" y="326" font-size="38">☀</text><text x="178" y="322" font-size="31" class="bold">19°C</text><text x="178" y="352" class="small muted">Despejado</text>
    <line x1="325" y1="298" x2="325" y2="373" stroke="#D7E2DD" stroke-width="2"/>
    <text x="596" y="316" text-anchor="end" class="tiny muted">Farmacia de turno</text><text x="596" y="345" text-anchor="end" class="small bold">Farmacias Ahumada</text><text x="596" y="371" text-anchor="end" class="tiny muted">Abierta 24 horas</text>

    <text x="93" y="448" font-size="23" class="bold">Para ti, cerca de casa</text>
    <rect x="91" y="470" width="538" height="240" rx="28" fill="url(#photo)"/>
    <path d="M112 666c85-97 156-132 238-104 67 22 112 11 258-66v194H112z" fill="#0B5F4D" opacity=".6"/>
    <rect x="112" y="492" width="122" height="34" rx="17" fill="#fff"/><text x="173" y="515" text-anchor="middle" font-size="14" fill="#0E8067" class="bold">PANORAMA</text>
    <text x="119" y="654" font-size="28" fill="#fff" class="bold">Todo lo que pasa cerca</text><text x="119" y="684" font-size="18" fill="#fff">Información útil para tu barrio</text>

    <g transform="translate(91 733)">
      <rect width="168" height="112" rx="24" fill="#fff" stroke="#D7E2DD"/><rect x="185" width="168" height="112" rx="24" fill="#fff" stroke="#D7E2DD"/><rect x="370" width="168" height="112" rx="24" fill="#fff" stroke="#D7E2DD"/>
      <text x="84" y="50" text-anchor="middle" font-size="30" fill="#18B68B">▣</text><text x="84" y="82" text-anchor="middle" class="small bold">Eventos</text>
      <text x="269" y="50" text-anchor="middle" font-size="30" fill="#18B68B">▤</text><text x="269" y="82" text-anchor="middle" class="small bold">Noticias</text>
      <text x="454" y="50" text-anchor="middle" font-size="30" fill="#E5484D">△</text><text x="454" y="82" text-anchor="middle" class="small bold">Alertas</text>
    </g>

    <rect x="91" y="870" width="538" height="78" rx="22" fill="#FFF9E8" stroke="#F5CF58"/><text x="119" y="915" font-size="22" class="bold">¿Necesitas una mano?</text><rect x="500" y="888" width="104" height="44" rx="22" fill="#18B68B"/><text x="552" y="916" text-anchor="middle" font-size="16" fill="#fff" class="bold">¡Pídelo!</text>

    <text x="93" y="997" font-size="25" class="bold">Mercado local</text><text x="601" y="997" text-anchor="end" font-size="17" fill="#0E8067" class="bold">Ver más →</text>
    <g transform="translate(91 1020)">
      <rect width="164" height="214" rx="22" fill="#fff" stroke="#D7E2DD"/><rect x="187" width="164" height="214" rx="22" fill="#fff" stroke="#D7E2DD"/><rect x="374" width="164" height="214" rx="22" fill="#fff" stroke="#D7E2DD"/>
      <rect x="10" y="10" width="144" height="116" rx="16" fill="#DDE9E4"/><path d="M30 104l38-42 31 29 23-22 26 35z" fill="#8CB9A8"/><text x="12" y="153" font-size="15" fill="#0E8067" class="bold">Venta</text><text x="12" y="179" font-size="17" class="bold">Bicicleta urbana</text><text x="12" y="202" font-size="15" class="muted">Cerca de ti</text>
      <rect x="197" y="10" width="144" height="116" rx="16" fill="#F3E6C8"/><circle cx="269" cy="67" r="37" fill="#E3BD69"/><text x="199" y="153" font-size="15" fill="#0E8067" class="bold">Regalo</text><text x="199" y="179" font-size="17" class="bold">Libros infantiles</text><text x="199" y="202" font-size="15" class="muted">Gratis</text>
      <rect x="384" y="10" width="144" height="116" rx="16" fill="#DCE6F0"/><path d="M412 91h88v18h-88zM434 42h44v52h-44z" fill="#8099B2"/><text x="386" y="153" font-size="15" fill="#0E8067" class="bold">Arriendo</text><text x="386" y="179" font-size="17" class="bold">Herramientas</text><text x="386" y="202" font-size="15" class="muted">Por día</text>
    </g>

    <rect x="67" y="1276" width="586" height="123" fill="#fff"/><line x1="67" y1="1276" x2="653" y2="1276" stroke="#D7E2DD"/>
    <g font-size="15" class="bold muted"><text x="116" y="1362" text-anchor="middle" fill="#0E8067">Inicio</text><text x="236" y="1362" text-anchor="middle">Mercado</text><text x="360" y="1362" text-anchor="middle">Servicios</text><text x="486" y="1362" text-anchor="middle">Comercios</text><text x="600" y="1362" text-anchor="middle">Chat</text></g>
    <g fill="none" stroke="#738079" stroke-width="4"><path d="M103 1327l13-11 13 11v19h-26z" stroke="#0E8067"/><rect x="224" y="1318" width="24" height="27" rx="4"/><path d="M350 1342l22-22M351 1321l20 21M475 1321h22v23h-22z"/><circle cx="600" cy="1331" r="14"/></g>
